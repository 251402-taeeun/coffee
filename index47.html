<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페인 지도 - 먹을 수 있는 곳 찾기</title>
    <style>
        /* 전체 화면 및 레이아웃 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 화면 좌우 2분할 컨테이너 */
        .app-container {
            display: flex;
            height: 100%;
        }

        /* 왼쪽 사이드바 디자인 */
        .sidebar {
            width: 380px;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 2;
        }

        /* 서비스 제목 영역 */
        .title-area {
            padding: 20px 20px 10px 20px;
            background-color: #ffffff;
        }
        .title-area h2 {
            font-size: 20px;
            color: #333;
        }
        .title-area p {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        /* 기획서에 있던 탭 메뉴 디자인 */
        .tab-area {
            display: flex;
            padding: 0 20px 10px 20px;
            background-color: #ffffff;
            gap: 5px;
        }
        .tab-button {
            flex: 1;
            padding: 10px;
            border: 1px solid #e0e0e0;
            background-color: #f1f3f5;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-button:hover {
            background-color: #e9ecef;
        }
        .tab-button.active {
            background-color: #fee500; /* 카카오 노란색 */
            border-color: #fee500;
        }

        /* 검색창 영역 */
        .search-area {
            padding: 0 20px 20px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }
        .search-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .search-area button {
            padding: 10px 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 결과 리스트 영역 (스크롤 가능) */
        .result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .result-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            background-color: #fff;
        }
        .result-item:hover {
            background-color: #f1f3f5;
        }
        .result-item .place-name {
            font-weight: bold;
            font-size: 16px;
            color: #d9480f; /* 카페인 느낌의 오렌지 브라운 포인트 컬러 */
            margin-bottom: 5px;
            display: block;
        }
        .result-item .place-address {
            font-size: 13px;
            color: #666;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1;
            position: relative;
        }

        /* 마커 클릭 시 나타나는 상세 팝업(인포윈도우) 디자인 */
        .popup-window {
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
        }
        .popup-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="title-area">
                <h2>⚡ 카페인 충전소 지도</h2>
                <p>5반 2번 권태은 기획작품</p>
            </div>
            
            <div class="tab-area">
                <button class="tab-button" onclick="searchByCategory('CE7', this)">☕ 카페</button>
                <button class="tab-button" onclick="searchByCategory('FD6', this)">🍔 음식점</button>
                <button class="tab-button" onclick="searchByCategory('CS2', this)">🏪 편의점</button>
            </div>

            <div class="search-area">
                <input type="text" id="keyword" placeholder="장소 직접 검색 (예: 빽다방)" onkeypress="if(event.keyCode==13){searchByKeyword();}">
                <button onclick="searchByKeyword()">검색</button>
            </div>

            <ul id="placesList" class="result-list">
                </ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=551d282e9cb6796473204793bf81469d&libraries=services"></script>
    
    <script>
        // 전역 변수 설정
        let map; // 지도 객체
        let placeService; // 카카오 장소 검색 서비스 객체
        let infowindow; // 마커 클릭 시 띄울 상세 팝업창 객체
        let markers = []; // 생성된 마커들을 관리할 배열
        let currentLatLng; // 사용자의 현재 위치 좌표

        // 지도가 로드된 후 실행 (로딩 오류 방지)
        window.onload = function() {
            kakao.maps.load(function() {
                initMap();
            });
        };

        // 지도 초기 설정 및 띄우기
        function initMap() {
            const mapContainer = document.getElementById('map'); 
            
            // 기본 중심 좌표 (위치 거부 시 서울시청 기준)
            let defaultCenter = new kakao.maps.LatLng(37.566826, 126.9786567);

            const mapOptions = {
                center: defaultCenter,
                level: 5 // 기획서 조건: 확대 레벨 5
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            placeService = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({zIndex:1}); // 팝업창 객체 초기화

            // 위치 권한 허용 받아 현재 위치를 중심으로 설정
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    currentLatLng = new kakao.maps.LatLng(lat, lon);
                    map.setCenter(currentLatLng); // 내 위치로 지도 중심 이동
                    
                    // 내 현재 위치에 특별한 마커 하나 표시하기
                    const currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentLatLng
                    });
                    
                    // 내 위치 마커 전용 팝업창
                    kakao.maps.event.addListener(currentMarker, 'click', function() {
                        infowindow.setContent('<div class="popup-window">📍 나의 현재 위치</div>');
                        infowindow.open(map, currentMarker);
                    });

                    // 처음 접속 시 자동으로 주변 '카페(CE7)'를 먼저 보여주도록 설정
                    searchByCategory('CE7', document.querySelector('.tab-button'));

                }, function(error) {
                    alert("위치 권한을 거부하여 기본 위치로 설정합니다.");
                    searchByCategory('CE7', document.querySelector('.tab-button'));
                });
            } else {
                alert("이 브라우저에서는 현재 위치 기능을 지원하지 않습니다.");
            }
        }

        // 기능 1: 탭 클릭 시 카카오 카테고리 API로 주변 장소 검색
        function searchByCategory(categoryCode, element) {
            // 탭 활성화 디자인 변경
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');

            // 검색창 글자 비우기
            document.getElementById('keyword').value = '';

            // 내 주변 기준 혹은 현재 지도 중심 기준으로 카테고리 검색 수행
            const searchOption = {
                location: map.getCenter(),
                radius: 2000, // 반경 2km 이내 검색
                sort: kakao.maps.services.SortBy.DISTANCE // 거리순 정렬
            };

            placeService.categorySearch(categoryCode, placesSearchCallback, searchOption);
        }

        // 기능 2: 검색창에 키워드 입력 후 버튼 클릭하여 검색
        function searchByKeyword() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.trim()) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            // 모든 탭 버튼 활성화 해제
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 키워드로 장소 검색 수행
            placeService.keywordSearch(keyword, placesSearchCallback); 
        }

        // 카카오 API 검색 결과 처리 콜백 함수
        function placesSearchCallback(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                // 정상적으로 검색 성공 시 결과를 화면에 렌더링
                displaySearchResults(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('주변에 해당 장소가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과를 마커와 왼쪽 리스트로 화면에 표시하는 함수
        function displaySearchResults(places) {
            const listContainer = document.getElementById('placesList');
            const mapBounds = new kakao.maps.LatLngBounds();
            
            // 핵심 기능: 새로 검색할 때 기존 마커 및 팝업창은 깨끗하게 지우기
            clearExistingMarkers();
            infowindow.close();
            listContainer.innerHTML = '';
            
            // 검색된 데이터 개수만큼 반복 처리
            for (let i = 0; i < places.length; i++) {
                const placeLatLng = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 1. 지도에 마커 생성 및 표시
                const marker = createMarker(placeLatLng);
                
                // 2. 왼쪽 리스트에 들어갈 HTML 요소(이름, 주소) 생성
                const listItem = createListItem(places[i]);

                // 지도 범위 자동 조절을 위해 좌표 수집
                mapBounds.extend(placeLatLng);

                // 3. 마커 클릭 시 상세 팝업(인포윈도우) 표시 기능 연결
                const popupContent = `
                    <div class="popup-window">
                        <div class="popup-title">${places[i].place_name}</div>
                        <span style="color:#777; font-size:11px;">${places[i].road_address_name || places[i].address_name}</span>
                    </div>
                `;

                // 마커에 클릭 이벤트 걸기
                kakao.maps.event.addListener(marker, 'click', function() {
                    infowindow.setContent(popupContent);
                    infowindow.open(map, marker);
                    map.panTo(placeLatLng);
                });

                // 리스트 아이템 클릭 시 지도 이동 및 팝업 표시 기능 연결
                listItem.onclick = function() {
                    infowindow.setContent(popupContent);
                    infowindow.open(map, marker);
                    map.setCenter(placeLatLng);
                    map.setLevel(3); // 클릭하면 자세히 보이도록 확대
                };

                listContainer.appendChild(listItem);
            }       

            // 검색된 장소들이 화면에 다 들어오도록 지도 시야 자동 범위 재설정
            map.setBounds(mapBounds);
        }

        // 검색 결과 리스트 아이템 HTML 구조 만드는 함수 (장소명과 주소 나열)
        function createListItem(place) {
            const li = document.createElement('li');
            li.className = 'result-item';

            const address = place.road_address_name ? place.road_address_name : place.address_name;
            
            li.innerHTML = `
                <span class="place-name">${place.place_name}</span>
                <span class="place-address">${address}</span>
            `;
            return li;
        }

        // 마커를 지도 위에 생성해 주는 함수
        function createMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position
            });
            marker.setMap(map);
            markers.push(marker); // 추후 삭제를 위해 배열에 저장
            return marker;
        }

        // 기존에 지도에 그려져 있던 마커들을 지우는 함수
        function clearExistingMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].
