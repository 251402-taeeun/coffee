<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 장소 검색 서비스</title>
    <style>
        /* 기본 여백 제거 및 전체 높이 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 전체를 감싸는 컨테이너: Flexbox를 사용하여 좌우로 분할 */
        .app-container {
            display: flex;
            height: 100%;
        }

        /* 왼쪽 사이드바 (검색창 + 결과 리스트) */
        .sidebar {
            width: 350px;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 2; /* 지도보다 위에 보이도록 설정 */
        }

        /* 탭 상단 메뉴 스타일 */
        .tab-container {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #333;
            border-bottom: 3px solid #fee500; /* 카카오 노란색 하단 선 */
        }

        /* 검색 영역 스타일 */
        .search-area {
            padding: 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .search-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .search-area button {
            padding: 10px 15px;
            background-color: #fee500; /* 카카오톡 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 검색 결과 리스트 영역 */
        .result-list {
            flex: 1;
            overflow-y: auto; /* 내용이 많아지면 스크롤 생성 */
            list-style: none;
        }

        .result-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #e9ecef;
        }

        .result-item .place-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }

        .result-item .place-address {
            font-size: 13px;
            color: #777;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1; /* 남은 공간을 모두 차지하도록 설정 */
            position: relative;
        }

        /* 커스텀 말풍선(오버레이) 스타일 */
        .custom-overlay {
            position: relative;
            margin-bottom: 45px; /* 마커의 머리 위에 안착하도록 조정 */
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #ffffff;
            padding: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            font-size: 13px;
            min-width: 220px;
            z-index: 5;
        }

        .custom-overlay .title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            display: block;
            padding-right: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-overlay .phone {
            color: #666;
            margin-bottom: 10px;
            display: block;
        }

        .custom-overlay .link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        .custom-overlay .link:hover {
            text-decoration: underline;
        }

        .custom-overlay .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            border: none;
            background: none;
            line-height: 1;
        }
        
        .custom-overlay .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>

                <button id="tab-CS2" class="tab-btn active" onclick="switchTab('CS2')">편의점</button>
                <button id="tab-CE7" class="tab-btn" onclick="switchTab('CE7')">카페</button>
            </div>

            <div class="search-area">

                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="result-list"></ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>
