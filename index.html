<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 장소 검색 서비스</title>
    <style>
        /* 기본 여백 제거 및 전체 높이 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 전체를 감싸는 컨테이너: Flexbox를 사용하여 좌우로 분할 */
        .app-container {
            display: flex;
            height: 100%;
        }

        /* 왼쪽 사이드바 (검색창 + 결과 리스트) */
        .sidebar {
            width: 350px;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 2; /* 지도보다 위에 보이도록 설정 */
        }

        /* 탭 상단 메뉴 스타일 */
        .tab-container {
            display: flex;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #333;
            border-bottom: 3px solid #fee500; /* 카카오 노란색 하단 선 */
        }

        /* 검색 영역 스타일 */
        .search-area {
            padding: 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .search-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .search-area button {
            padding: 10px 15px;
            background-color: #fee500; /* 카카오톡 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 검색 결과 리스트 영역 */
        .result-list {
            flex: 1;
            overflow-y: auto; /* 내용이 많아지면 스크롤 생성 */
            list-style: none;
        }

        .result-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #e9ecef;
        }

        .result-item .place-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }

        .result-item .place-address {
            font-size: 13px;
            color: #777;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            flex: 1; /* 남은 공간을 모두 차지하도록 설정 */
            position: relative;
        }

        /* 커스텀 말풍선(오버레이) 스타일 */
        .custom-overlay {
            position: relative;
            margin-bottom: 45px; /* 마커의 머리 위에 안착하도록 조정 */
            border-radius: 8px;
            border: 1px solid #ccc;
            background: #ffffff;
            padding: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            font-size: 13px;
            min-width: 220px;
            z-index: 5;
        }

        .custom-overlay .title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            display: block;
            padding-right: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .custom-overlay .phone {
            color: #666;
            margin-bottom: 10px;
            display: block;
        }

        .custom-overlay .link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        .custom-overlay .link:hover {
            text-decoration: underline;
        }

        .custom-overlay .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            border: none;
            background: none;
            line-height: 1;
        }
        
        .custom-overlay .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="tab-container">
                <button id="tab-CS2" class="tab-btn active" onclick="switchTab('CS2')">편의점</button>
                <button id="tab-CE7" class="tab-btn" onclick="switchTab('CE7')">카페</button>
            </div>

            <div class="search-area">
                <input type="text" id="keyword" placeholder="장소를 검색해보세요 (예: 강남역 맛집)" onkeypress="if(event.keyCode==13){searchPlaces();}">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="result-list"></ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=551d282e9cb6796473204793bf81469d&libraries=services"></script>
    
    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let ps; // 장소 검색 객체
        let markers = []; // 지도에 표시된 장소 마커 배열
        let currentLocationMarker; // 내 현재 위치 마커를 따로 관리할 변수
        let customOverlay; // 현재 띄워져 있는 커스텀 오버레이(말풍선) 객체
        let currentCategory = 'CS2'; // 현재 선택된 카테고리 (기본값: 편의점)

        // 페이지가 완전히 로드된 후 실행
        window.onload = function() {
            kakao.maps.load(function() {
                initMap();
            });
        };

        // 지도 초기화 함수
        function initMap() {
            const mapContainer = document.getElementById('map'); 
            let centerPosition = new kakao.maps.LatLng(37.566826, 126.9786567); // 서울시청 기본값

            const mapOptions = {
                center: centerPosition,
                level: 5 
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            ps = new kakao.maps.services.Places();

            // 위치 권한 허용 받아 현재 위치 정보 가져오기
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude; 
                    const lon = position.coords.longitude; 
                    const currentPosition = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(currentPosition);
                    
                    // 내 현재 위치를 파란 점 모양의 마커로 표시 (SVG 활용)
                    const currentLocImageUrl = 'data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="%23007AFF" stroke="white" stroke-width="3"/><circle cx="10" cy="10" r="9" fill="%23007AFF" fill-opacity="0.2"/></svg>';
                    const currentLocImageSize = new kakao.maps.Size(20, 20);
                    const currentLocImageOption = { offset: new kakao.maps.Point(10, 10) };
                    const currentLocMarkerImage = new kakao.maps.MarkerImage(currentLocImageUrl, currentLocImageSize, currentLocImageOption);

                    currentLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        image: currentLocMarkerImage
                    });

                    // 지도가 켜졌을 때 내 주변 카테고리 자동 검색
                    searchCategory();

                }, function(error) {
                    console.error("위치 정보를 가져올 수 없습니다: ", error);
                    alert("위치 정보를 가져올 수 없어 기본 위치로 설정합니다.");
                    searchCategory();
                });
            } else {
                alert("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
                searchCategory();
            }
        }

        // 탭 전환 기능 함수
        function switchTab(categoryCode) {
            currentCategory = categoryCode;

            // 모든 탭에서 active 클래스 제거 후 클릭된 탭에만 부여
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + categoryCode).classList.add('active');

            // 기존 마커 및 말풍선 닫기
            removeMarkers();
            if (customOverlay) {
                customOverlay.setMap(null);
            }

            // 바뀐 카테고리로 검색 실행
            searchCategory();
        }

        // 카테고리 전용 검색 함수 (현재 지도 중심 기준 반경 2000m)
        function searchCategory() {
            ps.categorySearch(currentCategory, placesSearchCB, {
                location: map.getCenter(),
                radius: 2000
            });
        }

        // 키워드 검색 기능 함수 (기존 유지하되 말풍선 정리 추가)
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('검색어를 입력해주세요!');
                return false;
            }

            if (customOverlay) {
                customOverlay.setMap(null);
            }

            ps.keywordSearch(keyword, placesSearchCB); 
        }

        // 장소검색 콜백함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
                return;
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
                return;
            }
        }

        // 검색 결과 목록과 마커를 표출하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds();
            
            listEl.innerHTML = '';
            removeMarkers();
            
            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 해당 장소의 카테고리 코드를 바탕으로 마커 생성
                const marker = addMarker(placePosition, places[i].category_group_code);
                const itemEl = getListItem(i, places[i]);

                bounds.extend(placePosition);

                // 리스트 아이템 클릭 시 지도 이동 및 오버레이(말풍선) 열기
                itemEl.onclick = function() {
                    map.setCenter(placePosition);
                    map.setLevel(3);
                    showOverlay(places[i], placePosition);
                };

                // 마커 클릭 시 오버레이(말풍선) 열기
                kakao.maps.event.addListener(marker, 'click', function() {
                    showOverlay(places[i], placePosition);
                });

                listEl.appendChild(itemEl);
            }       

            map.setBounds(bounds);
        }

        // 검색결과 항목을 생성하는 함수
        function getListItem(index, places) {
            const el = document.createElement('li');
            el.className = 'result-item';

            let itemStr = `<span class="place-name">${places.place_name}</span>`;
            
            if (places.road_address_name) {
                itemStr += `<span class="place-address">${places.road_address_name}</span>`;
            } else {
                itemStr += `<span class="place-address">${places.address_name}</span>`;
            }
            
            el.innerHTML = itemStr;
            return el;
        }

        // 카테고리별 마커 이미지를 정의하고 생성하는 함수
        function addMarker(position, categoryCode) {
            let markerImageUrl = '';
            
            // 편의점(CS2)은 파란색, 카페(CE7)는 빨간색 마커 지정
            if (categoryCode === 'CS2') {
                markerImageUrl = 'data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 24 36"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="%23007AFF"/></svg>';
            } else if (categoryCode === 'CE7') {
                markerImageUrl = 'data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 24 36"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="%23FF3B30"/></svg>';
            } else {
                // 기타 키워드 검색 시 회색 마커 제공
                markerImageUrl = 'data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 24 36"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="%23777777"/></svg>';
            }

            const imageSize = new kakao.maps.Size(28, 36);
            const imageOption = { offset: new kakao.maps.Point(14, 36) };
            const markerImage = new kakao.maps.MarkerImage(markerImageUrl, imageSize, imageOption);

            const marker = new kakao.maps.Marker({
                position: position,
                image: markerImage
            });

            marker.setMap(map);
            markers.push(marker);

            return marker;
        }

        // 커스텀 말풍선(오버레이)을 만들어 화면에 표시하는 함수
        function showOverlay(place, position) {
            // 이전에 열려 있던 말풍선이 있다면 지도에서 제거
            if (customOverlay) {
                customOverlay.setMap(null);
            }

            // 동적으로 말풍선 엘리먼트들 구성 (이벤트 바인딩 누락 방지 목적)
            const contentContainer = document.createElement('div');
            contentContainer.className = 'custom-overlay';

            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.innerText = place.place_name;
            contentContainer.appendChild(titleSpan);

            const phoneSpan = document.createElement('span');
            phoneSpan.className = 'phone';
            phoneSpan.innerText = place.phone ? place.phone : '전화번호 정보 없음';
            contentContainer.appendChild(phoneSpan);

            const detailLink = document.createElement('a');
            detailLink.className = 'link';
            detailLink.href = place.place_url;
            detailLink.target = '_blank';
            detailLink.innerText = '카카오맵에서 보기 →';
            contentContainer.appendChild(detailLink);

            const closeButton = document.createElement('button');
            closeButton.className = 'close-btn';
            closeButton.innerHTML = '&times;';
            closeButton.onclick = function() {
                customOverlay.setMap(null);
            };
            contentContainer.appendChild(closeButton);

            // 오버레이 객체 생성 및 지도 부착
            customOverlay = new kakao.maps.CustomOverlay({
                content: contentContainer,
                position: position,
                yAnchor: 1 // 마커 좌표 지점을 기준으로 엘리먼트 아래쪽 중앙이 오도록 정렬
            });

            customOverlay.setMap(map);
        }

        // 기존 장소 검색 마커들을 삭제하는 함수 (내 위치 마커는 지우지 않음)
        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }   
            markers = [];
        }
    </script>
</body>
</html>
